version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # markitdown[all] does not support Python 3.14 yet (youtube-transcript-api wheels).
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
