name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # Weekly rebuild to pick up security patches in the base image and system packages.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: markitdown-sandbox:test
          cache-from: type=gha

      - name: Smoke test
        run: |
          printf '<h1>Hello</h1><p>from markitdown-sandbox</p>' > test.html
          docker run --rm -v "$PWD:/data:ro" -w /data --read-only --tmpfs /tmp --cap-drop ALL \
            markitdown-sandbox:test test.html | tee out.md
          grep -q "# Hello" out.md

      - name: Smoke test UI
        run: |
          docker run -d --name ui -p 127.0.0.1:8000:8000 --read-only --tmpfs /tmp --cap-drop ALL \
            markitdown-sandbox:test serve
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/healthz && break; sleep 1; done
          curl -fs http://127.0.0.1:8000/ | grep -q "MarkItDown Sandbox"
          curl -fs -X POST -H "X-Filename: test.html" --data-binary @test.html \
            http://127.0.0.1:8000/convert | grep -q "# Hello"
          docker rm -f ui

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
